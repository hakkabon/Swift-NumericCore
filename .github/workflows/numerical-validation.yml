name: Numerical validation

on:
  # FFI update pull requests are opened by github-actions[bot].  A regular
  # pull_request workflow for an Actions-authored PR can be held for approval
  # (and GITHUB_TOKEN recursion prevention can suppress it altogether).
  # pull_request_target starts from the trusted base-branch workflow instead.
  # The job below is restricted to branches in this repository before it ever
  # checks out or executes the proposed merge commit.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numerical-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-validation:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    steps:
      - name: Check out pull-request merge
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Check out repository
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run complete validation suite
        run: swift test
      - name: Produce reproducible standard-tier evidence
        run: swift run -c release NumericCoreValidation standard > numerical-validation.json
      - name: Upload numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: swift-numerical-validation
          path: numerical-validation.json
