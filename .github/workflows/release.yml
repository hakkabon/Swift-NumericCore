name: Validate release and notify consumers

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test tagged Swift and vendored Rust FFI
        run: swift test --filter NumericCoreTests
      - name: Verify vendored FFI provenance
        run: |
          test -s Frameworks/FFI_VERSION
          for slice in Frameworks/NumericCoreFFI.xcframework/*/; do
            test -f "${slice}/Headers/module.modulemap"
          done
      - name: Notify ecosystem compatibility workflow
        env:
          TOKEN: ${{ secrets.DATALENSING_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "No dispatch token; DataLensing's weekly compatibility run is the fallback."
            exit 0
          fi
          curl -sS -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/hakkabon/DataLensing/dispatches \
            -d '{"event_type":"numericcore-release","client_payload":{"tag":"${{ github.ref_name }}"}}'
