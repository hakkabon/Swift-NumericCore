name: Numerical validation

on:
  # FFI update pull requests are opened by github-actions[bot].  A regular
  # pull_request workflow for an Actions-authored PR can be held for approval
  # (and GITHUB_TOKEN recursion prevention can suppress it altogether).
  # pull_request_target starts from the trusted base-branch workflow instead.
  # The job below is restricted to branches in this repository before it ever
  # checks out or executes the proposed merge commit.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays, UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numerical-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-validation:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - name: Check out pull-request merge
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Check out repository
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run complete validation suite
        run: NUMERICCORE_EXPECTED_RUST_TAG="$(cat .ffi-version)" swift test
      - name: Verify published Rust FFI assets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUST_TAG=$(cat .ffi-version)
          gh release download "$RUST_TAG" --repo hakkabon/Rust-NumericCore \
            --pattern NumericCoreFFI.xcframework.zip --pattern nc_ffi.swift \
            --dir "${RUNNER_TEMP}/numericcore-ffi-assets"
          python3 -B scripts/verify_ffi_release.py "${RUNNER_TEMP}/numericcore-ffi-assets"
      - name: Run clean consumer against this checkout
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NUMERICCORE_PACKAGE_PATH: ${{ github.workspace }}
        run: swift run --package-path scripts/consumer-smoke
      - name: Run clean consumer against the Swift 1.0 release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NUMERICCORE_SWIFT_TAG: "1.0.0"
        run: swift run --package-path scripts/consumer-smoke --scratch-path "${RUNNER_TEMP}/numericcore-1x-smoke"
      - name: Produce reproducible standard-tier evidence
        if: ${{ !cancelled() }}
        run: |
          swift --version > toolchain.txt
          swift run -c release NumericCoreValidation standard > numerical-validation.json
      - name: Upload numerical evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-numerical-validation
          path: |
            numerical-validation.json
            toolchain.txt
