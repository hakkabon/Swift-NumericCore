name: Update Rust FFI

# Keeps Swift-NumericCore's NumericCoreFFI binaryTarget pointed at the
# latest Rust-NumericCore release: refreshes Package.swift's `url:`/
# `checksum:` (via scripts/set_ffi_binary_target.py), refreshes
# Sources/NCBindings/Generated/*.swift, records the synchronized release
# in `.ffi-version`, then opens a PR.
#
# Supersedes the local-path/vendored-Frameworks approach from ADR 0009;
# see ADR 0010. Each run synchronizes the remote checksum, generated binding,
# and independent provenance marker as one reviewed change.
#
# Triggers, in order of preference:
#   1. repository_dispatch `rust-release` — sent by Rust-NumericCore's
#      release.yml on every version-tag push.
#   2. weekly schedule — polls Rust-NumericCore's `latest` release, so a
#      missed dispatch still converges within a week.
#   3. manual workflow_dispatch with an explicit `rust_tag` — use this
#      to retry a compatibility check or recover immediately from a missed
#      dispatch without waiting on the schedule.

on:
  repository_dispatch:
    types: [rust-release]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      rust_tag:
        description: "Rust-NumericCore tag to sync (e.g. v0.1.0). Empty = latest release."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-rust-ffi
  cancel-in-progress: false

env:
  RUST_REPO: hakkabon/Rust-NumericCore

jobs:
  update-ffi:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to sync
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.rust_tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG=$(gh release view --repo "${RUST_REPO}" --json tagName -q .tagName)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Package.swift may be pre-pinned while a phase is being prepared,
          # so its URL is not proof that the generated bindings were synced.
          # `.ffi-version` is written only by this workflow together with the
          # downloaded binding and checksum.
          CURRENT=$(cat .ffi-version 2>/dev/null || true)
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}; synchronized FFI: ${CURRENT:-<none>}"

      - name: Skip if already up to date
        id: check
        run: |
          if [ "${{ steps.tag.outputs.current }}" = "${{ steps.tag.outputs.tag }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "FFI assets already synchronized to ${{ steps.tag.outputs.tag }} - nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ffi-update
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${RUST_REPO}" \
            --pattern "NumericCoreFFI.xcframework.zip" \
            --pattern "nc_ffi.swift" \
            --dir /tmp/ffi-update --clobber

      - name: Validate Headers layout
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          # Same guard Rust-NumericCore's release.yml already ran before
          # publishing - repeated here since this is the last point
          # before the artifact gets pinned by checksum. See
          # Frameworks/README.md's "Why Headers/module.modulemap must
          # exist" section for why this matters (canImport(nc_ffiFFI)
          # silently evaluates false without it, and the link fails with
          # undefined uniffi_*/ffi_* symbols).
          rm -rf /tmp/ffi-check && mkdir -p /tmp/ffi-check
          unzip -q /tmp/ffi-update/NumericCoreFFI.xcframework.zip -d /tmp/ffi-check
          for slice in /tmp/ffi-check/NumericCoreFFI.xcframework/*/; do
            test -f "${slice}/Headers/module.modulemap" \
              || { echo "missing ${slice}/Headers/module.modulemap" >&2; exit 1; }
          done

      - name: Compute checksum
        if: steps.check.outputs.up_to_date == 'false'
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum /tmp/ffi-update/NumericCoreFFI.xcframework.zip)
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Flip/update Package.swift's binaryTarget
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          python3 scripts/set_ffi_binary_target.py \
            "${{ steps.tag.outputs.tag }}" \
            "${{ steps.checksum.outputs.checksum }}"

      - name: Refresh bindings and provenance
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          find Sources/NCBindings/Generated -name "*.swift" -delete
          cp /tmp/ffi-update/nc_ffi.swift Sources/NCBindings/Generated/
          printf '%s\n' "${{ steps.tag.outputs.tag }}" > .ffi-version

      - name: Verify sparse-statistics bridge ABI
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          # Fail before opening a binary-target update PR if a Rust release
          # accidentally omits or renames the sparse-statistics contract.
          # The hand-written facade and generated binding must never compile
          # against different framework ABIs.
          BINDINGS=Sources/NCBindings/Generated/nc_ffi.swift
          grep -q 'solveSparseWeightedLeastSquares' "${BINDINGS}"
          grep -q 'solveSparsePenalizedWeightedLeastSquares' "${BINDINGS}"
          grep -q 'FfiSparseStatisticalSolveResult' "${BINDINGS}"
          grep -q 'solveSparseLu' "${BINDINGS}"
          grep -q 'solveSparseCholesky' "${BINDINGS}"
          grep -q 'case ilu0' "${BINDINGS}"
          grep -q 'case incompleteCholesky' "${BINDINGS}"

      - name: Build + test
        id: validation
        if: steps.check.outputs.up_to_date == 'false'
        continue-on-error: true
        run: |
          swift build
          swift test

      - name: Open update PR
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "ffi/update-${{ steps.tag.outputs.tag }}"
          delete-branch: true
          title: "Sync NumericCoreFFI to ${{ steps.tag.outputs.tag }}"
          body: |
            Automated FFI sync.

            - Rust release: https://github.com/${{ env.RUST_REPO }}/releases/tag/${{ steps.tag.outputs.tag }}
            - `Package.swift`'s `NumericCoreFFI` binary target now points at
              this release's checksummed asset (ADR 0010).
            - Refreshed `Sources/NCBindings/Generated/nc_ffi.swift`.
            - Recorded the synchronized Rust release in `.ffi-version`.
            - Compatibility validation outcome: `${{ steps.validation.outcome }}`.

            If the UniFFI interface changed (new/renamed functions or
            types), `Sources/NCBindings/FFIBridge.swift` may need a
            companion source update. The PR is created even when validation
            fails so that such an update cannot suppress the FFI sync itself.
            After the companion Swift commit reaches the base branch, rerun
            this workflow to update and revalidate the same PR.
          add-paths: |
            .ffi-version
            Package.swift
            Sources/NCBindings/Generated/

      - name: Enforce validation after PR creation
        if: steps.check.outputs.up_to_date == 'false' && steps.validation.outcome == 'failure'
        run: |
          echo "::error::The FFI update PR was created, but the current Swift base is not compatible with the new UniFFI surface. Push the companion Swift update, then rerun this workflow."
          exit 1
