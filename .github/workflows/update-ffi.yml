name: Update Rust FFI

# Keeps Swift-NumericCore's NumericCoreFFI binaryTarget pointed at the
# latest Rust-NumericCore release: refreshes Package.swift's `url:`/
# `checksum:` (via scripts/set_ffi_binary_target.py) and
# Sources/NCBindings/Generated/*.swift, then opens a PR.
#
# Supersedes the local-path/vendored-Frameworks approach from ADR 0009
# — see ADR 0010. The first successful run of this workflow after this
# change performs the one-time flip: Package.swift's NumericCoreFFI
# target moves from a local `path:` to a remote `url:`/`checksum:`, and
# the now-redundant Frameworks/ directory is removed from the repo.
# Every run after that is just a checksum/tag/bindings refresh.
#
# Triggers, in order of preference:
#   1. repository_dispatch `rust-release` — sent by Rust-NumericCore's
#      release.yml on every version-tag push.
#   2. weekly schedule — polls Rust-NumericCore's `latest` release, so a
#      missed dispatch still converges within a week.
#   3. manual workflow_dispatch with an explicit `rust_tag` — use this
#      right after Rust-NumericCore's very first tagged release, to
#      perform the initial flip without waiting on the schedule.

on:
  repository_dispatch:
    types: [rust-release]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      rust_tag:
        description: "Rust-NumericCore tag to sync (e.g. v0.1.0). Empty = latest release."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  RUST_REPO: hakkabon/Rust-NumericCore

jobs:
  update-ffi:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to sync
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.rust_tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG=$(gh release view --repo "${RUST_REPO}" --json tagName -q .tagName)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Best-effort extraction of the currently-pinned tag from
          # Package.swift's existing binaryTarget block, so the "skip if
          # already up to date" check below works without a separate
          # tracking file. Empty on the very first run (local `path:`
          # form has no "download/" substring to match) - correctly
          # treated as "needs update" in that case.
          CURRENT=$(grep -A2 'name: "NumericCoreFFI"' Package.swift \
            | grep -oE 'download/[^/]+' | sed 's#download/##' || true)
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}; currently pinned: ${CURRENT:-<none - local path>}"

      - name: Skip if already up to date
        id: check
        run: |
          if [ "${{ steps.tag.outputs.current }}" = "${{ steps.tag.outputs.tag }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already pinned to ${{ steps.tag.outputs.tag }} - nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ffi-update
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${RUST_REPO}" \
            --pattern "NumericCoreFFI.xcframework.zip" \
            --pattern "nc_ffi.swift" \
            --dir /tmp/ffi-update --clobber

      - name: Validate Headers layout
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          # Same guard Rust-NumericCore's release.yml already ran before
          # publishing - repeated here since this is the last point
          # before the artifact gets pinned by checksum. See
          # Frameworks/README.md's "Why Headers/module.modulemap must
          # exist" section for why this matters (canImport(nc_ffiFFI)
          # silently evaluates false without it, and the link fails with
          # undefined uniffi_*/ffi_* symbols).
          rm -rf /tmp/ffi-check && mkdir -p /tmp/ffi-check
          unzip -q /tmp/ffi-update/NumericCoreFFI.xcframework.zip -d /tmp/ffi-check
          for slice in /tmp/ffi-check/NumericCoreFFI.xcframework/*/; do
            test -f "${slice}/Headers/module.modulemap" \
              || { echo "missing ${slice}/Headers/module.modulemap" >&2; exit 1; }
          done

      - name: Compute checksum
        if: steps.check.outputs.up_to_date == 'false'
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum /tmp/ffi-update/NumericCoreFFI.xcframework.zip)
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Flip/update Package.swift's binaryTarget
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          python3 scripts/set_ffi_binary_target.py \
            "${{ steps.tag.outputs.tag }}" \
            "${{ steps.checksum.outputs.checksum }}"

      - name: Refresh bindings + remove obsolete Frameworks/
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          find Sources/NCBindings/Generated -name "*.swift" -delete
          cp /tmp/ffi-update/nc_ffi.swift Sources/NCBindings/Generated/
          git rm -r --ignore-unmatch --quiet Frameworks/ || true

      - name: Build + test
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          swift build
          swift test

      - name: Open update PR
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "ffi/update-${{ steps.tag.outputs.tag }}"
          delete-branch: true
          title: "Sync NumericCoreFFI to ${{ steps.tag.outputs.tag }}"
          body: |
            Automated FFI sync.

            - Rust release: https://github.com/${{ env.RUST_REPO }}/releases/tag/${{ steps.tag.outputs.tag }}
            - `Package.swift`'s `NumericCoreFFI` binary target now points at
              this release's checksummed asset (ADR 0010).
            - Refreshed `Sources/NCBindings/Generated/nc_ffi.swift`.
            - If this was the first run since the remote-binaryTarget
              switch, `Frameworks/` was removed - it's no longer needed.
            - `swift build` + `swift test` passed on the update runner.

            If the UniFFI interface changed (new/renamed functions or
            types), `Sources/NCBindings/FFIBridge.swift` may need a
            follow-up - it is the only hand-written file that names
            generated symbols directly.
          add-paths: |
            Package.swift
            Sources/NCBindings/Generated/
            Frameworks/
